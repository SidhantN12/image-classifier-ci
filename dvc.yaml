stages:
  prepare:
    cmd: python prepare.py
    deps:
      - prepare.py
      - model.py
      - data/raw
    params:
      - prepare
    outs:
      - data/processed

  train:
    cmd: python train.py
    deps:
      - train.py
      - model.py
      - data/processed
    params:
      - train
    outs:
      - models/digit_classifier.joblib

  evaluate:
    cmd: python evaluate.py
    deps:
      - evaluate.py
      - models/digit_classifier.joblib
      - data/processed
    metrics:
      - metrics.json:
          cache: false
